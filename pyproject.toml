[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling>=1.10",
]

[project]
name = "pycaputo"
version = "0.10.2"
description = "Evaluate fractional integrals and solve fractional ODEs"
readme = "README.rst"
keywords = [
    "fractional-derivatives",
    "fractional-integrals",
    "quadrature",
    "time-stepping",
]
license = "MIT"
maintainers = [
    { name = "Alexandru Fikl", email = "alexfikl@gmail.com" },
]
authors = [
    { name = "Alexandru Fikl", email = "alexfikl@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
dependencies = [
    "array-api-compat>=1.11",
    "numpy>=2.1",
    "pymittagleffler>=0.1",
    "rich>=13",
    "scipy>=1.7",
    # NOTE: for `Self` (used in `history.py`)
    # NOTE: for `TypeIs` (used in `typing.py`)
    "typing-extensions>=4",
]
# NOTE: this is only here for readthedocs (keep in sync with the dependency group)
optional-dependencies.docs = [ "sphinx>=6", "sphinx-book-theme", "sphinx-design>=0.4" ]
urls.Documentation = "https://pycaputo.readthedocs.io"
urls.Repository = "https://github.com/alexfikl/pycaputo"

[dependency-groups]
dev = [ "pyproject-fmt", "reuse", "typos", "uv" ]
# NOTE: typing dependencies: matplotlib, scienceplots, scipy-stubs, types-dataclasses
test = [
    "matplotlib",
    "mpmath",
    "pytest",
    "pytest-benchmark",
    "pytest-github-actions-annotate-failures",
    "ruff",
    "scienceplots",
    "scipy-stubs",
    "ty",
    "types-dataclasses",
]
docs = [ "sphinx>=6", "sphinx-book-theme", "sphinx-design>=0.4" ]
examples = [ "numba" ]
vis = [ "scienceplots>=2.1" ]

[tool.hatch]
metadata.allow-direct-references = true
build.targets.wheel.packages = [
    "src/pycaputo",
]
build.targets.sdist.exclude = [
    ".ci",
    ".github",
    "docs/_build",
]

[tool.ruff]
target-version = "py310"
line-length = 88
preview = true
lint.select = [
    "A",   # flake8-builtins
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # flake8
    "F",   # flake8
    "FBT", # flake8-boolean-trap
    "G",   # flake8-logging-format
    "I",   # flake8-isort
    "ISC", # flake8-implicit-str-concat
    "N",   # pep8-naming
    "NPY", # numpy
    "PGH", # pygrep-hooks
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RUF", # ruff
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking
    "UP",  # pyupgrade
    "W",   # flake8
]
lint.ignore = [
    "any-type",                                  # any-type
    "assert",                                    # assert
    "exec-builtin",                              # exec-builtin
    "import-outside-top-level",                  # import-outside-top-level
    "invalid-argument-name",                     # non-lowercase-argument
    "magic-value-comparison",                    # magic-value-comparison
    "module-import-not-at-top-of-file",          # module-import-not-at-top-of-file
    "no-self-use",                               # no-self-use
    "non-augmented-assignment",                  # non-augmented-assignment
    "non-empty-init-module",                     # non-empty-init-module
    "non-lowercase-variable-in-function",        # non-lowercase-variable-in-function
    "quoted-annotation",                         # quoted-annotation
    "single-line-implicit-string-concatenation", # single-line-implicit-string-concatenation
    "stdlib-module-shadowing",                   # shadowing-builtin-module
    "too-many-arguments",                        # too-many-arguments
    "too-many-branches",                         # too-many-branches
    "too-many-locals",                           # too-many-locals
    "too-many-positional-arguments",             # too-many-positional
    "too-many-return-statements",                # too-many-return-statements
    "too-many-statements",                       # too-many-statements
    "too-many-statements-in-try-clause",         # too-many-statements-in-try
    "unnecessary-dunder-call",                   # unnecessary-dunder-call
    "unnecessary-literal-within-tuple-call",     # incorrectly-parenthesized-tuple-in-subscript
    "whitespace-before-punctuation",             # whitespace-before-punctuation
]
lint.flake8-quotes.docstring-quotes = "double"
lint.flake8-quotes.inline-quotes = "double"
lint.flake8-quotes.multiline-quotes = "double"
lint.isort.force-wrap-aliases = true
lint.isort.known-first-party = [
    "pycaputo",
]
lint.isort.required-imports = [
    "from __future__ import annotations",
]

[tool.typos]
default.extend-words.ND = "ND"
default.extend-words.Pn = "Pn"
files.extend-exclude = [
    "docs/benchmarks",
]

[tool.ty]
rules.undefined-reveal = "ignore"
rules.unused-ignore-comment = "ignore"

[tool.pytest]
ini_options.testpaths = "tests"
ini_options.addopts = [
    "-rswx",
    "--durations=25",
    "--capture=no",
    "--verbose",
]
